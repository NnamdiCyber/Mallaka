apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mallaka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/mallaka/api:latest
          command: ["node", "services/api/dist/index.js"]
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: mallaka-config
            - secretRef:
                name: mallaka-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /docs
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mallaka
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
