apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper
  namespace: mallaka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keeper
  template:
    metadata:
      labels:
        app: keeper
    spec:
      containers:
        - name: keeper
          image: ghcr.io/mallaka/keeper:latest
          command: ["node", "services/keeper/dist/index.js"]
          envFrom:
            - configMapRef:
                name: mallaka-config
            - secretRef:
                name: mallaka-secrets
---
