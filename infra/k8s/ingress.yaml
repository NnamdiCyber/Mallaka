apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mallaka-ingress
  namespace: mallaka
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.mallaka.io
        - ussd.mallaka.io
      secretName: mallaka-tls-certs
  rules:
    - host: api.mallaka.io
      http:
        paths:
          - path: /v1/webhooks
            pathType: Prefix
            backend:
              service:
                name: payments
                port:
                  number: 3002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
    - host: ussd.mallaka.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ussd
                port:
                  number: 3003
