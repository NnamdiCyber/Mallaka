services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mallaka
      POSTGRES_PASSWORD: mallaka
      POSTGRES_DB: mallaka
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mallaka -d mallaka"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["pnpm", "--filter", "@mallaka/api", "dev"]
    profiles: ["full"]
    ports:
      - "3001:3001"
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payments:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["pnpm", "--filter", "@mallaka/payments", "dev"]
    profiles: ["full"]
    ports:
      - "3002:3002"
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  keeper:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["pnpm", "--filter", "@mallaka/keeper", "dev"]
    profiles: ["full"]
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy

  indexer:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["pnpm", "--filter", "@mallaka/indexer", "dev"]
    profiles: ["full"]
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  lock-bridge:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["pnpm", "--filter", "@mallaka/lock-bridge", "dev"]
    profiles: ["full"]
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sponsor:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["pnpm", "--filter", "@mallaka/sponsor", "dev"]
    profiles: ["full"]
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy

  notifier:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["pnpm", "--filter", "@mallaka/notifier", "dev"]
    profiles: ["full"]
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: